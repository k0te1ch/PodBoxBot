name: Smoke — /start opens the menu, "New episode" asks the episode type
timeout: 20
steps:
  - command: start
  - expect:
      contains: "Что делаем"
      buttons: ["🎙 Новый выпуск"]
  - click: "🎙 Новый выпуск"
  # the dialog edits the same message
  - wait_until:
      contains: "Какой выпуск оформляем"
      buttons: ["Основной выпуск", "Послешоу"]
  - click: "Основной выпуск"
  - wait_until:
      icontains: "пришли mp3"
