[tool.poetry]
name = "transcriber"
version = "0.1.0"
description = "Experimental episode transcription service: faster-whisper on CPU, one job at a time"
authors = ["k0te1ch <khvostov40@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
faster-whisper = "^1.2.1"
# faster-whisper allows any tokenizers below 1.0, and the resolver then picks
# 0.13, which has no wheel for Python 3.12 and needs a Rust toolchain.
tokenizers = ">=0.20,<1"
# The service decodes audio itself, in chunks (transcribe_one.py), and feeds
# faster-whisper arrays. faster-whisper 1.2's own file decoding breaks on
# PyAV 19 (av.open no longer takes metadata_errors), so do not hand it paths.
av = ">=12"
numpy = ">=1.26"
redis = "^4.6.0"
loguru = "^0.7.3"
pydantic-settings = "^2.9.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
