[tool.poetry]
name = "publisher_patreon"
version = "0.1.0"
description = "Patreon publisher microservice"
authors = ["k0te1ch <khvostov40@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.2.2"
loguru = "^0.7.3"
prometheus-client = "^0.21.1"
aioprometheus = "^23.12.0"
aiohttp = "^3.13.3"
httpx = "^0.28.1"
fastavro = "^1.12.1"
confluent-kafka = {extras = ["avro"], version = "^2.12.0"}
pydantic = "^2.12.3"
pydantic-settings = "^2.9.1"
sagenza-tgbot-sdk = { git = "https://github.com/k0te1ch/sagenza-tgbot-sdk.git", tag = "v0.2.1" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
