# Лежит в корне, а не в app/bot/pyproject.toml: rootdir pytest берёт по месту
# конфига, а фикстуры из conftest.py видны «только своему каталогу» лишь
# внутри rootdir. С конфигом в app/bot каталог tests оказывался снаружи, все
# conftest.py становились общими, и из двух одноимённых фикстур побеждала
# та, чей conftest загрузился последним: результат зависел от набора файлов.
[pytest]
addopts = --cov=./app/ -m "not e2e"
asyncio_default_fixture_loop_scope = function
markers =
    e2e: end-to-end tests against a live bot via tgtest (require TG_* creds, run with -m e2e)
