apiVersion: 1

groups:
  - orgId: 1
    name: podboxbot
    folder: PodBoxBot
    interval: 1m
    rules:
      - uid: podboxbot-bot-down
        title: Бот недоступен
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: Prometheus не может снять метрики с bot:8080 больше двух минут.
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(up{job="podboxbot"}) or vector(0)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: podboxbot-disk-full
        title: Диск заполнен больше чем на 85%
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Точка монтирования {{ $labels.mountpoint }} заполнена на {{ humanize $values.A.Value }}%."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }

      - uid: podboxbot-publish-failures
        title: Ошибки публикации
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $labels.job }} не смог опубликовать эпизод в {{ $labels.target }} за последние 15 минут."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (job, target) (increase({__name__=~".+_upload_failure_total"}[15m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
