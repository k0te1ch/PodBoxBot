apiVersion: 1

# Источники ниже каждый старт удаляются и создаются заново.
#
# Grafana 12.2+ обновляет существующий источник, только если его uid совпадает
# с uid из этого файла. Если источник с тем же именем создан раньше без uid
# (старые версии этого файла или руками в интерфейсе), провижининг падает с
# «Datasource provisioning error: data source not found», и Grafana не
# стартует. Удаление по имени перед созданием чинит такой том, а на остальных
# источник просто пересоздаётся с тем же uid. Дашборды, алерты и пользователи
# при этом не удаляются: они ссылаются на источники по uid из этого файла.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    editable: true
    jsonData:
      tlsSkipVerify: true
      httpMethod: POST
      timeInterval: 1s
      maxLines: 10000
      minInterval: 1s
    readOnly: false
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    basicAuth: false
    editable: true
    jsonData:
      tlsSkipVerify: true
      maxLines: 10000
      minInterval: 1s
