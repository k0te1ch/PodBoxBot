  # The transcriber has its own lock (faster-whisper and friends) that no
  # other job installs: check that it resolves to wheels on Python 3.12, that
  # the service imports, and run its queue tests against those dependencies.
  test-transcriber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --upgrade pip && python -m pip install poetry==2.3.4
      - name: Install transcriber dependencies (system env, mirrors Dockerfile)
        working-directory: app/transcriber
        run: |
          poetry config virtualenvs.create false
          poetry install --only main --no-root
      - name: Import the service the way its container does
        working-directory: app/transcriber
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: |
          python -c "import main, bench, transcribe_one, faster_whisper"
          # Decoding goes through PyAV, whose API faster-whisper depends on:
          # a second of silence is enough to catch an incompatible pair.
          python - <<'PY'
          import wave

          from faster_whisper.audio import decode_audio

          with wave.open("silence.wav", "wb") as audio:
              audio.setnchannels(1)
              audio.setsampwidth(2)
              audio.setframerate(16000)
              audio.writeframes(b"␀␀" * 16000)
          assert len(decode_audio("silence.wav")) == 16000
          PY
      - name: Install test tooling
        run: python -m pip install "pytest>=9.0.3,<10" "pytest-asyncio>=1.4,<2" "fakeredis>=2.26,<3"
      - name: Run transcriber tests
        run: pytest -c app/bot/pyproject.toml -o addopts="" tests/unit/transcriber

  # Live Kafka + Schema Registry: the new serializer API end to end, plus
  # reading messages written by the legacy AvroProducer still in prod topics.
  kafka-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Start Kafka and Schema Registry
        run: docker compose -f tests/integration/kafka/docker-compose.yml up -d --wait
      - name: Install Poetry
        run: python -m pip install --upgrade pip && python -m pip install poetry==2.3.4
      - name: Install FTP publisher dependencies (system env, mirrors Dockerfile)
        working-directory: app/publishers/FTP
        # sagenza-tgbot-sdk is private: SDK_DEPLOY_KEY is its read-only deploy key.
        env:
          SDK_DEPLOY_KEY: ${{ secrets.SDK_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null ~/sdk_deploy_key
          printf '%s\n' "$SDK_DEPLOY_KEY" > ~/sdk_deploy_key
          export GIT_SSH_COMMAND="ssh -i $HOME/sdk_deploy_key -o StrictHostKeyChecking=accept-new"
          git config --global url."git@github.com:k0te1ch/sagenza-tgbot-sdk".insteadOf "https://github.com/k0te1ch/sagenza-tgbot-sdk"
          poetry config virtualenvs.create false
          poetry config system-git-client true
          poetry install --only main --no-root
      - name: Install test tooling
        run: python -m pip install "pytest>=8.3.2,<9" "pytest-asyncio>=0.24,<0.25"
      - name: Run Kafka e2e tests
        env:
          KAFKA_E2E_BOOTSTRAP: localhost:9092
          KAFKA_E2E_SCHEMA_REGISTRY: http://localhost:8081
        run: pytest -c app/bot/pyproject.toml -o addopts="" tests/integration/kafka -v
      - name: Kafka logs on failure
        if: failure()
        run: docker compose -f tests/integration/kafka/docker-compose.yml logs --tail=200

  # Dispatched runs only (release-please.yml starts one on the release PR).
  # GitHub leaves check runs of a workflow_dispatch run out of the PR's
  # required checks, but it does count commit statuses. So the result of each
  # job required by the "main protection" ruleset is copied to a commit status
  # with the same name. Keep `needs` in sync with the ruleset's check list.
  report-required-checks:
    if: always() && github.event_name == 'workflow_dispatch'
    needs:
      - lint
      - release-notes
      - test
      - test-publisher-ftp
      - test-publisher-wordpress
      - test-publisher-boosty
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mirror job results as commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS" |
            while read -r job result; do
              # A skipped job passes, the same way GitHub treats a skipped check.
              case "$result" in
                success|skipped) state=success ;;
                *) state=failure ;;
              esac
              gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                -f state="$state" -f context="$job" \
                -f target_url="$RUN_URL" -f description="workflow_dispatch: $result" \
                --silent
              echo "$job: $result -> $state"
            done
