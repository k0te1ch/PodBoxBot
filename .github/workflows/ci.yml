name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The release PR is opened with GITHUB_TOKEN, so its pull_request runs
  # wait for manual approval. release-please.yml dispatches this workflow on
  # the release branch instead, and report-required-checks at the bottom
  # turns the results into the statuses the ruleset looks for.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        # Pin ruff: an unpinned `--upgrade` lets a new ruff release enable new
        # rules and silently turn a green main red without any code change.
        run: python -m pip install --upgrade pip && python -m pip install ruff==0.11.13
      - name: Ruff lint
        run: ruff check "$GITHUB_WORKSPACE/app" "$GITHUB_WORKSPACE/tests"
      - name: Ruff format check
        run: ruff format --check "$GITHUB_WORKSPACE/app" "$GITHUB_WORKSPACE/tests"

  # The release PR must carry Russian notes for its version: the bot sends
  # release-notes/ru/<version>.md to the show's admins after a deploy, and
  # without the file they only get the bare version number. The notes land
  # in main through a normal PR; release-please rebuilds its branch on top of
  # it ("always-update" in release-please-config.json). Runs for the release
  # branch on any event (the release PR is checked via workflow_dispatch),
  # skipped (reported as success) everywhere else.
  release-notes:
    if: startsWith(github.head_ref || github.ref_name, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Russian release notes for the release version
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          notes="release-notes/ru/${version}.md"
          if ! grep -q '[^[:space:]]' "$notes" 2>/dev/null; then
            echo "::error file=${notes}::Missing or empty ${notes}. Add Russian release notes for ${version} in a separate PR to main."
            exit 1
          fi
          echo "Found ${notes}"

  # Job id is the status-check context required by the "main protection"
  # ruleset ("test"). A matrix would report it as "test (3.12)" and never
  # satisfy that requirement, so keep it a single un-matrixed job.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        # Pin poetry: the committed locks were generated by this version, and an
        # unpinned `--upgrade` has twice downgraded virtualenv mid-install and
        # broken poetry's own files (flaky 'Cannot install ...' failures).
        run: python -m pip install --upgrade pip && python -m pip install poetry==2.3.4
      - name: Install bot dependencies (system env, mirrors Dockerfile)
        working-directory: app/bot
        # --only main,testing mirrors the Dockerfile (main) plus what the suite
        # needs (pytest, pytest-cov). The dev group holds ruff and pre-commit,
        # which have their own pinned install in the lint job.
        # sagenza-tgbot-sdk is private: SDK_DEPLOY_KEY is its read-only deploy key.
        env:
          SDK_DEPLOY_KEY: ${{ secrets.SDK_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null ~/sdk_deploy_key
          printf '%s\n' "$SDK_DEPLOY_KEY" > ~/sdk_deploy_key
          export GIT_SSH_COMMAND="ssh -i $HOME/sdk_deploy_key -o StrictHostKeyChecking=accept-new"
          git config --global url."git@github.com:k0te1ch/sagenza-tgbot-sdk".insteadOf "https://github.com/k0te1ch/sagenza-tgbot-sdk"
          poetry config virtualenvs.create false
          poetry config system-git-client true
          poetry install --only main,testing --no-root
      - name: Run tests
        # Publisher microservice tests need each service's own deps (asyncssh,
        # aioprometheus, ...) which aren't in the bot env — they run in the
        # dedicated test-publisher-* jobs below.
        run: pytest -c app/bot/pyproject.toml --ignore=tests/e2e --ignore=tests/unit/publishers

  test-publisher-ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        # Pin poetry: the committed locks were generated by this version, and an
        # unpinned `--upgrade` has twice downgraded virtualenv mid-install and
        # broken poetry's own files (flaky 'Cannot install ...' failures).
        run: python -m pip install --upgrade pip && python -m pip install poetry==2.3.4
      - name: Install FTP publisher dependencies (system env, mirrors Dockerfile)
        working-directory: app/publishers/FTP
        # sagenza-tgbot-sdk is private: SDK_DEPLOY_KEY is its read-only deploy key.
        env:
          SDK_DEPLOY_KEY: ${{ secrets.SDK_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null ~/sdk_deploy_key
          printf '%s\n' "$SDK_DEPLOY_KEY" > ~/sdk_deploy_key
          export GIT_SSH_COMMAND="ssh -i $HOME/sdk_deploy_key -o StrictHostKeyChecking=accept-new"
          git config --global url."git@github.com:k0te1ch/sagenza-tgbot-sdk".insteadOf "https://github.com/k0te1ch/sagenza-tgbot-sdk"
          poetry config virtualenvs.create false
          poetry config system-git-client true
          poetry install --only main --no-root
      - name: Install test tooling
        run: python -m pip install "pytest>=9.0.3,<10" "pytest-asyncio>=1.4,<2"
      - name: Run FTP publisher tests
        run: pytest -c app/bot/pyproject.toml -o addopts="" tests/unit/publishers/ftp

