name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Lets the job dispatch CI on the release branch (see the last step).
  actions: write

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # GITHUB_TOKEN не триггерит другие workflow при создании тега.
          # Если нужно, чтобы тег запускал publish-пайплайн — замени на PAT/App-токен.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Pushes made with GITHUB_TOKEN don't start pull_request workflows the
      # normal way: GitHub parks the release PR's CI as "action_required" until
      # someone approves it. workflow_dispatch is the exception GITHUB_TOKEN is
      # allowed to trigger. The dispatched run tests the PR's head commit and
      # copies the required jobs' results (lint, test, release-notes, ...) to
      # commit statuses, which the main ruleset accepts; the check runs of a
      # dispatched workflow alone don't count toward a PR's required checks.
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh pr list --head "$RELEASE_BRANCH" --state open --json headRefOid --jq '.[0].headRefOid // empty')
          if [ -z "$sha" ]; then
            echo "No open release PR"
            exit 0
          fi
          dispatched=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$sha" --json databaseId --jq length)
          if [ "$dispatched" -gt 0 ]; then
            echo "CI already ran for $sha"
            exit 0
          fi
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          echo "Dispatched CI for $RELEASE_BRANCH at $sha"
