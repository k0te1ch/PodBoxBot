# Каталогов восемь только потому, что каждый сервис — отдельный poetry-проект.
# Корня в списке нет: pyproject.toml/poetry.lock в корне репозитория не
# существует, и алерты, которые Dependabot заводил на "/", относились к
# файлу, удалённому ещё раньше.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /app/bot
      - /app/publishers/FTP
      - /app/publishers/WordPress
      - /app/publishers/Boosty
      - /app/publishers/VK
      - /app/publishers/Patreon
      - /app/publishers/Sponsr
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Порядок важен: пакет попадает в первую группу, под шаблон которой
      # подошёл. Сначала то, что нельзя мержить по одним unit-тестам.
      #
      # Клиент Kafka и сериализация Avro: проверяются только прогоном на
      # стенде с настоящим брокером, поэтому идут отдельным PR и не тянут за
      # собой остальные обновления.
      kafka:
        patterns:
          - confluent-kafka
          - fastavro
        update-types:
          - minor
          - patch
      # aiogram и redis ходят парой (см. ignore ниже) и тоже ждут стенда.
      telegram:
        patterns:
          - aiogram
          - redis
        update-types:
          - minor
          - patch
      # Один PR на все остальные патч/минор-бампы: иначе семь сервисов с почти
      # одинаковым списком зависимостей дают семь PR на каждый aiohttp.
      pip:
        patterns:
          - "*"
        exclude-patterns:
          - confluent-kafka
          - fastavro
          - aiogram
          - redis
        update-types:
          - minor
          - patch
      # Обновления безопасности в группы выше не попадают (те только для
      # обычных обновлений): без своей группы один алерт на транзитивный пакет
      # открывал по PR на каждый каталог. Kafka, Avro, aiogram и redis сюда не
      # входят и приходят отдельными PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - confluent-kafka
          - fastavro
          - aiogram
          - redis
    ignore:
      # redis идёт в паре с aiogram: хранилище состояний работает только с теми
      # версиями, что aiogram объявляет в своём extra `redis` (для 3.31 это
      # >=6.2,<8). Мажорную версию поднимаем руками вместе с aiogram; границу
      # сторожит tests/unit/services/test_shutdown.py.
      - dependency-name: redis
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /app/bot
      - /app/kafka
      - /app/schema-watcher
      - /app/publishers/FTP
      - /app/publishers/WordPress
      - /app/publishers/Boosty
      - /app/publishers/VK
      - /app/publishers/Patreon
      - /app/publishers/Sponsr
    schedule:
      interval: monthly
    commit-message:
      prefix: build
